<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineMaro</title>

    <link rel="stylesheet" href="./style.css">

    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <!-- Header Section Starts Here -->
    <header>
        <div class="movie-lists-menu">
            <div class="watched-container">
                <button class="watched-list-btn" type="button">
                    <i class="fa-solid fa-eye"></i>
                    <span>Assistidos</span>
                </button>

                <div class="watched-list-container">
                    <p>Nenhum filme assistido</p>
                </div>
            </div>

            <div class="favorites-container">
                <button class="favorites-btn" type="button">
                    <i class="fa-solid fa-heart"></i>
                    <span>Favoritos</span>
                </button>

                <div class="favorites-list-container">
                    <p>Nenhum filme favoritado</p>
                </div>
            </div>
        </div>

        <div class="logo">
            <img src="./images/MaronazCinema Logo.png" alt="MaronazCinema Logo">

            <p>CineMaro</p>
        </div>

        <div class="theme-mode-btns">
            <i class="fa-solid fa-toggle-on dark-mode"></i>
            <i class="fa-solid fa-toggle-off light-mode"></i>
        </div>
    </header>
    <!-- Header Section Ends Here -->

    <!-- Input Section Starts Here -->
    <div class="input-field">
        <input type="text" placeholder="Nome do Filme ...">

        <div class="search-movie-list-container">
            <!-- Os resultados da pesquisa serão inseridos aqui -->
        </div>
    </div>
    <!-- Input Section Ends Here -->

    <!-- Movie Container Section Starts Here -->
    <main>
        <section>
            <div class="movie-container">
                <div class="movie-details-container">
                    <div class="movie-image">
                        <img src="https://image.tmdb.org/t/p/original/zB7zJQgk4pPoxsPzZP0CqUgHuXN.jpg"
                            alt="Movie Image">
                    </div>

                    <div class="movie-details">
                        <div class="movie-heading">
                            <h1 class="movie-name"></h1>
                        </div>

                        <div class="movie-actions">
                            <button class="favorite-btn" type="button">
                                <i class="fa-regular fa-heart"></i>
                                <span>Adicionar aos Favoritos</span>
                            </button>

                            <button class="watched-btn" type="button">
                                <i class="fa-regular fa-eye"></i>
                                <span>Marcar como assistido</span>
                            </button>
                        </div>

                        <p class="movie-original-name">
                            Título Original:
                            <span></span>
                        </p>

                        <div class="genres">
                            <p>Gêneros:</p>
                            <ul class="genres-list"></ul>
                        </div>

                        <p class="ratings">
                            Avaliações Externas:
                            <span class="rating-value"></span>

                            <span class="rating-stars" aria-label="Avaliação em estrelas">
                            </span>
                        </p>

                        <p class="description"></p>

                        <p class="adult-content">
                            Conteúdo Adulto:
                            <span></span>
                        </p>

                        <p class="original-language">
                            Linguagem Original:
                            <span></span>
                        </p>

                        <div class="personal-rating-container">
                            <p>Deixe sua avaliação pessoal:</p>
                            <div class="personal-rating-stars"
                                 role="group"
                                 aria-label="Avaliação pessoal (0 a 10 estrelas)">
                            </div>
                            <span class="personal-rating-value">
                                Sem avaliação
                            </span>
                        </div>
                    </div>
                </div>

                <div class="cast-details-container">
                    <h1>Cast</h1>

                    <div class="cast-details">
                        <!-- O elenco será inserido aqui -->
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- Movie Container Section Ends Here -->

    <!-- Scripts Goes Here -->
    <script src="./script.js" defer></script>
</body>

</html>
